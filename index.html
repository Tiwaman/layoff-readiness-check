<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDEF; --paper:#F7F9F9; --ink:#14262E; --muted:#56676E; --line:#C9D3D6;
  --low:#2E7A6B; --mid:#B9862A; --high:#A63E36; --soft:#DCE4E6;
  --shadow:0 1px 2px rgba(20,38,46,.05),0 10px 30px rgba(20,38,46,.07);
  --ease:cubic-bezier(.2,.7,.2,1);
  --sans:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E191D; --paper:#15242A; --ink:#E2EBED; --muted:#93A5AB; --line:#2A3D44;
    --low:#4FB09C; --mid:#D9A846; --high:#D86A5F; --soft:#1C2E35;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0E191D; --paper:#15242A; --ink:#E2EBED; --muted:#93A5AB; --line:#2A3D44;
  --low:#4FB09C; --mid:#D9A846; --high:#D86A5F; --soft:#1C2E35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
main{max-width:660px;margin:0 auto;padding:40px 22px 64px}
h1{font-size:clamp(2.1rem,7vw,3.3rem);line-height:1.04;letter-spacing:-0.03em;font-weight:800;margin:0 0 18px}
h2{font-size:1.35rem;letter-spacing:-0.01em;margin:0 0 10px;font-weight:700}
h3{font-size:1.02rem;margin:0 0 4px;font-weight:600}
p{margin:0 0 14px}
.lede{font-family:var(--serif);font-size:1.25rem;line-height:1.55;color:var(--ink);max-width:36em}
.meta{color:var(--muted);font-size:.93rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--low);margin:0 0 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--low);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 26px;font-weight:600;font-size:1rem;transition:transform .15s var(--ease),box-shadow .15s,opacity .15s}
.btn:hover:not(:disabled){opacity:.92;transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,38,46,.18)}
.btn:active:not(:disabled){transform:none;box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-quiet{background:transparent;border:1px solid var(--line);border-radius:999px;padding:12px 22px;font-weight:500;transition:border-color .15s,background-color .15s}
.btn-quiet:hover{border-color:var(--muted);background:var(--paper)}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.95rem;margin-bottom:44px}
.brand svg{flex:none}
@keyframes up{from{opacity:0;transform:translateY(12px)}}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:660px;margin:0 auto;padding:12px 22px 0}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .brand{margin:0;font-size:.9rem}
.top-meta{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{height:3px;background:var(--soft);margin:11px 0 0;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--low);border-radius:2px;transition:width .5s var(--ease)}

/* intro */
.hero>*{animation:up .55s var(--ease) both}
.hero>:nth-child(2){animation-delay:.05s}.hero>:nth-child(3){animation-delay:.1s}.hero>:nth-child(4){animation-delay:.15s}.hero>:nth-child(5){animation-delay:.2s}.hero>:nth-child(n+6){animation-delay:.25s}
.chips{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.86rem;font-weight:500}
.chips svg{width:15px;height:15px;flex:none;fill:none;stroke:var(--low);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.float{transform:translate(250px,236px);animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(250px,236px)}30%{transform:translate(266px,222px)}60%{transform:translate(238px,212px)}80%{transform:translate(256px,228px)}}

/* quadrant */
.quad{width:100%;max-width:440px;margin:28px 0 30px;display:block}
.quad .zone-label{font-family:var(--sans);font-size:12.5px;font-weight:600;fill:var(--ink)}
.quad .axis{font-family:var(--sans);font-size:12px;fill:var(--muted)}

/* question */
.qmeta{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:0 0 16px}
.qmeta>div:first-child{min-width:0;flex:1}
.secname{color:var(--muted);font-size:.9rem;font-weight:500;margin:0 0 10px}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:220px}
.seg{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s var(--ease)}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.mini svg{width:72px;height:72px;display:block}
.mini span{font-size:.68rem;color:var(--muted);white-space:nowrap}
#mdot{transition:transform .7s var(--ease)}
.stage{position:relative}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px 32px 26px}
.card.leaving{position:absolute;top:0;left:0;right:0;pointer-events:none}
.in-r{animation:inR .22s var(--ease) both}.in-l{animation:inL .22s var(--ease) both}
.out-l{animation:outL .22s var(--ease) both}.out-r{animation:outR .22s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(20px)}}
@keyframes inL{from{opacity:0;transform:translateX(-20px)}}
@keyframes outL{to{opacity:0;transform:translateX(-20px)}}
@keyframes outR{to{opacity:0;transform:translateX(20px)}}
.qtext{font-size:clamp(1.4rem,4.4vw,1.8rem);line-height:1.22;letter-spacing:-0.018em;font-weight:700;margin:0 0 8px}
.qhelp{color:var(--muted);margin:0 0 4px}
.kbhint{display:none;color:var(--muted);font-size:.82rem;margin:6px 0 0}
.opts{display:grid;gap:10px;margin:24px 0 26px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;font-size:1rem;line-height:1.35;transition:border-color .15s,transform .15s var(--ease),box-shadow .15s}
.opt .ot{flex:1}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .mark{flex:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink)}
.check{width:14px;height:14px;fill:none;stroke:var(--paper);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.check path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .28s var(--ease) .04s}
.opt[aria-pressed="true"] .check path{stroke-dashoffset:0}
.opt.pop{animation:pop .3s var(--ease)}
@keyframes pop{35%{transform:scale(.975)}70%{transform:scale(1.008)}}
.key{display:none;flex:none;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:.74rem;font-weight:600;color:var(--muted);place-items:center;font-variant-numeric:tabular-nums}
@media (hover:hover){ .opt:hover{border-color:var(--muted);transform:translateY(-1px);box-shadow:var(--shadow)} .opt[aria-pressed="true"]:hover{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),var(--shadow)} }
@media (hover:hover) and (pointer:fine){ .key{display:inline-grid} .kbhint{display:block} }
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* milestone */
.ms{text-align:center;padding:10px 0 4px}
.ms-check{width:64px;height:64px;margin:0 auto 18px;display:block;fill:none;stroke:var(--low);stroke-linecap:round;stroke-linejoin:round}
.ms-check circle{stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s var(--ease) .1s forwards}
.ms-check path{stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s var(--ease) .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ms h2{font-size:clamp(1.3rem,4.2vw,1.65rem);letter-spacing:-0.015em;margin:0 0 12px}
.ms-fact{font-family:var(--serif);font-size:1.15rem;line-height:1.5;max-width:30em;margin:0 auto 22px}
.ms-pips{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.ms-pips span{width:34px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ms-pips span.on i{display:block;height:100%;background:var(--low)}
.ms-pips span.now i{animation:fill .6s var(--ease) .3s both}
@keyframes fill{from{width:0}to{width:100%}}
.ms .btn{margin:10px 0 6px}

/* results */
.verdict{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.02;letter-spacing:-0.02em;margin:0 0 14px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 8px}
.score{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:18px}
.score .lab{color:var(--muted);font-size:.9rem}
.score .band{font-size:1.5rem;font-weight:700;letter-spacing:-0.01em;margin:2px 0 10px}
.score .num{display:inline-block;white-space:nowrap;font-size:.95rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;width:0;transition:width 1s var(--ease) .3s}
.result-quad{margin:22px 0 8px}
#dot{transition:transform 1.1s var(--ease) .2s}
section.block{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.rv.in{opacity:1;transform:none}
.driver{display:grid;grid-template-columns:10px 1fr;gap:14px;margin-bottom:18px}
.driver .pip{width:10px;height:10px;border-radius:50%;margin-top:7px}
.driver p{color:var(--muted);margin:0}
.plan-prog{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:16px 0 4px}
.ring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:var(--soft)}
.ring .val{stroke:var(--low);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .6s var(--ease)}
.plan-prog b{display:block;font-size:1rem}
.plan-prog .meta{margin:0;font-size:.86rem}
.plan-done{color:var(--low);font-weight:600;margin:12px 0 0;animation:up .45s var(--ease) both}
.plan-done:empty{display:none}
.when{margin-top:26px}
.when h3{display:flex;align-items:baseline;gap:10px;font-size:1.08rem;margin-bottom:10px}
.when h3 span{color:var(--muted);font-weight:400;font-size:.9rem}
.tasks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.tasks li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 16px 13px 48px;position:relative;transition:background-color .25s}
.tasks input{-webkit-appearance:none;appearance:none;margin:0;position:absolute;left:15px;top:14px;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;background:var(--paper);cursor:pointer;transition:background-color .15s,border-color .15s}
.tasks input:checked{background:var(--low);border-color:var(--low)}
.tasks .check{position:absolute;left:15px;top:14px;width:20px;height:20px;padding:3px;pointer-events:none}
.tasks li.done .check path{stroke-dashoffset:0}
.tasks li.done{background:transparent}
.tasks label{cursor:pointer;text-decoration:line-through;text-decoration-color:transparent;transition:color .3s,text-decoration-color .3s}
.tasks li.done label{color:var(--muted);text-decoration-color:var(--line)}
.share{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
.share textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:.95rem;background:var(--bg);color:var(--ink);resize:vertical;margin:8px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:.9rem;color:var(--muted);margin-top:40px;line-height:1.55}
.toast{color:var(--low);font-weight:600;font-size:.95rem}
@media (max-width:480px){
  main{padding-top:28px} .brand{margin-bottom:30px} .scores{gap:10px} .score{padding:14px} .score .band{font-size:1.25rem} .score .num{display:block;margin-top:2px} .score .sep{display:none}
  .card{padding:24px 20px 20px;border-radius:18px} .opt{padding:14px 15px;gap:12px} .top-in{padding:10px 16px 0}
}
@media (max-width:420px){ .top .bname{display:none} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme]{--bg:#fff;--paper:#fff;--ink:#000;--muted:#333;--line:#bbb;--soft:#e6e6e6;--shadow:none}
  body{font-size:11pt;background:#fff;color:#000}
  main{max-width:none;padding:0}
  .top,.noprint,button,.btn,.btn-quiet,.link{display:none!important}
  .rv{opacity:1!important;transform:none!important}
  .brand{margin-bottom:18px}
  .quad{max-width:300px;margin:12px 0}
  .score,.plan-prog,.tasks li{box-shadow:none;break-inside:avoid}
  .when,.driver{break-inside:avoid}
  section.block{margin-top:24px;padding-top:16px}
  .bar i,.ring .val,.tasks input:checked,.quad rect,.pip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .note{margin-top:24px}
}
</style>
</head>
<body>
<header class="top" id="top" hidden></header>
<main id="app"></main>
<div class="sr" id="sr" aria-live="polite"></div>

<script>
const SECTIONS = [
  {id:"company", name:"Your company", fact:"Most companies signal cuts months ahead. Hiring freezes and budget cuts are usually the first signs."},
  {id:"role", name:"Your role", fact:"Roles tied clearly to revenue or critical systems are typically among the last to be cut."},
  {id:"you", name:"You at work", fact:"A strong relationship with your manager is one of the best protections you can build."},
  {id:"cushion", name:"Your safety net"}
];

// p = points. Risk questions: higher = more exposed. Cushion questions: higher = better prepared.
const QS = [
  // Company
  {id:"health", s:"company", type:"risk", w:1.3, q:"How has your company's business been doing over the past year?",
   opts:[{t:"Growing strongly",p:0},{t:"Stable",p:1},{t:"Slowing down",p:2},{t:"Shrinking or losing money",p:3},{t:"Not sure",p:1.5}],
   driver:{title:"The business is slowing", why:"When revenue stalls, companies look for costs to cut, and salaries are usually the biggest one."},
   tip:{when:"month", t:"Start a quiet job search now. Set alerts for three to five target companies so you aren't starting from zero if cuts come."}},
  {id:"layoffs", s:"company", type:"risk", w:1.3, q:"Has your company had layoffs in the last 12 months?",
   opts:[{t:"No",p:0},{t:"One round",p:2},{t:"More than one round",p:3},{t:"Not sure",p:1}],
   driver:{title:"Recent layoff rounds", why:"Once a company has cut once, further rounds are common as plans get revised."},
   tip:{when:"week", t:"Make a 'just in case' list: personal contacts of colleagues, work samples you're allowed to keep, and your benefits details."}},
  {id:"hiring", s:"company", type:"risk", w:1.1, q:"What does hiring look like at your company right now?",
   opts:[{t:"Actively hiring",p:0},{t:"Hiring only for key roles",p:1},{t:"Hiring freeze",p:2.5},{t:"Open roles and backfills are being cancelled",p:3},{t:"Not sure",p:1}],
   driver:{title:"Hiring has stopped", why:"Freezes and cancelled roles are often the first visible sign of cost cutting."},
   tip:{when:"month", t:"Ask your manager plainly how next quarter's headcount plan looks for your team. Managers often share more than you'd expect."}},
  {id:"changes", s:"company", type:"risk", w:1.1, multi:true, q:"Which of these have happened recently?", help:"Select all that apply.",
   opts:[{t:"New CEO or senior leadership",p:1.5},{t:"Merger or acquisition",p:2},{t:"Restructuring or reorg announced",p:2},{t:"My manager changed",p:1},{t:"None of these",p:0,none:true}],
   driver:{title:"Leadership or structural change", why:"New leaders, mergers and reorgs usually bring role reviews and team consolidation."},
   tip:{when:"month", t:"Get time with any new leader early. Show what your team delivers, using the metrics they care about."}},
  {id:"funding", s:"company", type:"risk", w:1.0, q:"Which best describes your company?",
   opts:[{t:"Established and profitable",p:0.5},{t:"Government, nonprofit or education",p:0.5},{t:"Well-funded startup",p:1},{t:"Owned by private equity",p:2},{t:"Startup that needs to raise money soon",p:3},{t:"Not sure",p:1.5}],
   driver:{title:"Funding pressure", why:"Startups that need to raise soon, and private-equity-owned companies, often cut staff to stretch cash or hit profit targets."},
   tip:{when:"90", t:"List a few companies in more stable parts of your industry, so you can move on your own terms if you choose to."}},
  {id:"costcuts", s:"company", type:"risk", w:1.0, multi:true, q:"Have you noticed any cost-cutting signals?", help:"Select all that apply.",
   opts:[{t:"Travel, perks or events cut",p:1},{t:"Budgets frozen or tools cancelled",p:1.5},{t:"Contractors or vendors let go",p:1.5},{t:"Sudden push to return to office",p:1},{t:"None of these",p:0,none:true}],
   driver:{title:"Cost-cutting signals", why:"Cuts to travel, tools, vendors and budgets often come before cuts to headcount."}},
  // Role
  {id:"revenue", s:"role", type:"risk", w:1.3, q:"How directly does your work connect to revenue?",
   opts:[{t:"I directly bring in or protect revenue",p:0},{t:"I support teams that bring in revenue",p:1},{t:"I'm in an internal function",p:2},{t:"It's hard to tie my work to business results",p:3}],
   driver:{title:"Distance from revenue", why:"Work that's hard to tie to money earned or saved is easier to cut on a spreadsheet."},
   tip:{when:"month", t:"Translate your work into numbers: money earned, money saved, hours saved, or risk avoided. Put two of these in your next update."}},
  {id:"replace", s:"role", type:"risk", w:1.2, q:"If you left tomorrow, how hard would you be to replace?",
   opts:[{t:"Very hard, I hold knowledge nobody else has",p:0},{t:"Hard, it would take months",p:1},{t:"Others could cover my work",p:2},{t:"My work could easily be absorbed",p:3}],
   driver:{title:"Easy to cover", why:"If teammates can absorb your work, your role is easier to consolidate."},
   tip:{when:"90", t:"Take ownership of something critical and visible: a key system, client relationship, or process people rely on."}},
  {id:"ai", s:"role", type:"risk", w:1.1, q:"How much of your day-to-day work could AI or automation handle today?",
   opts:[{t:"Very little",p:0},{t:"Some of it",p:1},{t:"A lot of it",p:2},{t:"Most of it",p:3}],
   driver:{title:"Automation exposure", why:"Tasks AI can already do are getting more scrutiny in budget reviews."},

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function persist(s=step){ store(KEY,{answers,step:s}); }
function restore(){
  const d = load(KEY);
  if(!d || typeof d!=="object" || !d.answers || typeof d.answers!=="object") return null;
  const a = {};
  QS.forEach(q=>{
    const v = d.answers[q.id], ok = i=>Number.isInteger(i) && i>=0 && i<q.opts.length;
    if(q.multi ? Array.isArray(v) && v.every(ok) : ok(v)) a[q.id]=v;
  });
  if(!Object.keys(a).length) return null;
  let s = Math.max(0, Math.min(QS.length, parseInt(d.step,10)||0));
  const first = QS.findIndex(q=>!(q.id in a));
  if(s>=QS.length && first>=0) s = first;
  return {answers:a, step:s};
}

function points(q){
  const a = answers[q.id];
  if(a===undefined) return null;
  if(q.multi){ return Math.min(3, a.reduce((s,i)=>s+q.opts[i].p,0)); }
  return q.opts[a].p;
}
const answered = q => answers[q.id]!==undefined && (!q.multi || answers[q.id].length>0);

// Same formula as compute(), restricted to answered questions; centre (50) until a type has any answers.
function partial(){
  const r = QS.filter(q=>q.type==="risk" && answered(q)), c = QS.filter(q=>q.type==="cushion" && answered(q));
  return {
    e: r.length ? r.reduce((s,q)=>s+points(q)*q.w,0)/r.reduce((s,q)=>s+3*q.w,0)*100 : 50,
    c: c.length ? c.reduce((s,q)=>s+points(q),0)/(3*c.length)*100 : 50,
    n: QS.filter(answered).length
  };
}

function timeLeft(from){
  const s = (QS.length-from)*10;
  return s<60 ? "under a minute left" : `~${Math.ceil(s/60)} min left`;
}

function shell(){
  if(document.getElementById("stage")) return;
  if(!topbar.firstChild) topbar.innerHTML = `<div class="top-in"><div class="top-row">${brand}<span class="top-meta" id="tmeta"></span></div><div class="pbar" aria-hidden="true"><i id="tbar"></i></div></div>`;

function updateChrome(){
  const si = ms!==null ? ms : SECTIONS.findIndex(s=>s.id===QS[step].s);
  const p = partial();
  document.getElementById("tmeta").textContent = ms!==null
    ? `Section ${ms+1} of ${SECTIONS.length} complete · ${timeLeft(step+1)}`
    : `Question ${step+1} of ${QS.length} · ${timeLeft(step)}`;
  document.getElementById("tbar").style.width = p.n/QS.length*100+"%";
  document.getElementById("secname").textContent = `Section ${si+1} of ${SECTIONS.length} · ${SECTIONS[si].name}`;
  app.querySelectorAll(".seg i").forEach((el,k)=>{
    const qs = QS.filter(q=>q.s===SECTIONS[k].id);
    el.style.width = qs.filter(answered).length/qs.length*100+"%";
  });
  document.getElementById("mdot").style.transform = `translate(${7+p.c/100*58}px,${7+(1-p.e/100)*58}px)`;
  const lab = p.n ? `Your position so far, based on ${p.n} of ${QS.length} answers` : "Your position so far: no answers yet";
  document.getElementById("mini").setAttribute("aria-label",lab);

function swap(html,dir){
  const stage = document.getElementById("stage"), old = stage.querySelector(".card:not(.leaving)");
  const card = document.createElement("div");
  card.className = "card"; card.innerHTML = html;
  if(old){
    old.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    if(reduce.matches || !dir) old.remove();
    else { old.classList.add("leaving", dir>0?"out-l":"out-r"); old.setAttribute("aria-hidden","true"); old.inert=true; setTimeout(()=>old.remove(),240); }
    if(dir && !reduce.matches) card.classList.add(dir>0?"in-r":"in-l");
  }
  stage.appendChild(card);
  return card;
}

function renderQ(dir=0){
  clearTimeout(timer); busy=false; ms=null;

  const q = QS[step], a = answers[q.id];
  const sel = i => q.multi ? (a||[]).includes(i) : a===i;
  const card = swap(`
    <h2 class="qtext" id="qh" tabindex="-1">${esc(q.q)}</h2>

function pop(b){ b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }

function choose(q,i,b){
  if(busy) return;
  const btns = b.parentElement.querySelectorAll(".opt");
  if(q.multi){
    let a = answers[q.id] ? [...answers[q.id]] : [];
    if(q.opts[i].none){ a = a.includes(i)?[]:[i]; }
    else{
      a = a.filter(x=>!q.opts[x].none);
      a = a.includes(i) ? a.filter(x=>x!==i) : [...a,i];
    }
    answers[q.id]=a;
    btns.forEach(x=>x.setAttribute("aria-pressed", a.includes(+x.dataset.i)));
    if(a.includes(i)) pop(b);
    const nx=document.getElementById("next"); if(nx) nx.disabled = !a.length;
  } else {
    busy=true;
    answers[q.id]=i;
    btns.forEach(x=>x.setAttribute("aria-pressed", +x.dataset.i===i));
    pop(b);
    timer=setTimeout(advance,350);
  }
  persist();
  updateChrome();
}

function advance(){
  clearTimeout(timer); busy=false;
  if(step>=0 && step<QS.length && ms===null){
    const si = SECTIONS.findIndex(s=>s.id===QS[step].s);
    if(si<SECTIONS.length-1 && QS[step+1].s!==QS[step].s){ renderMilestone(si); return; }
  }
  if(step<QS.length-1){ step++; renderQ(1); } else renderResult();
}

function back(){
  clearTimeout(timer); busy=false;
  if(ms!==null) renderQ(-1);
  else if(step===0) renderIntro();
  else { step--; renderQ(-1); }
}

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||!document.getElementById("stage")) return;
  const t=e.target;
  if(t.closest && t.closest("input,textarea,select,[contenteditable]")) return;
  const onBtn = t.tagName==="BUTTON";
  if(ms===null){
    const q=QS[step];
    if(/^[1-9]$/.test(e.key)){
      const b=document.querySelector(`#stage .card:not(.leaving) .opt[data-i="${+e.key-1}"]`);
      if(b){ e.preventDefault(); choose(q,+e.key-1,b); }
      return;
    }
    if(e.key==="Enter" && q.multi && !onBtn){
      const nx=document.getElementById("next");
      if(nx && !nx.disabled){ e.preventDefault(); advance(); }
      return;
    }
  } else if(e.key==="Enter" && !onBtn){ e.preventDefault(); advance(); return; }
  if(e.key==="Backspace" || e.key==="ArrowLeft"){ e.preventDefault(); back(); }
});

function compute(){
  const risk = QS.filter(q=>q.type==="risk"), cush = QS.filter(q=>q.type==="cushion");
  const rNum = risk.reduce((s,q)=>s+points(q)*q.w,0), rDen = risk.reduce((s,q)=>s+3*q.w,0);
  const exposure = Math.round(rNum/rDen*100);
  const cushion = Math.round(cush.reduce((s,q)=>s+points(q),0)/(3*cush.length)*100);
  return {exposure, cushion};
}
function expBand(x){ return x<25?["Low","var(--low)"]:x<45?["Moderate","var(--mid)"]:x<65?["Elevated","var(--high)"]:["High","var(--high)"]; }
function cushBand(x){ return x<30?["Thin","var(--high)"]:x<55?["Building","var(--mid)"]:x<75?["Solid","var(--low)"]:["Strong","var(--low)"]; }

function verdict(e,c){
  const exposed = e>=45, ready = c>=55;
  if(exposed && !ready) return ["Act this month","Your job shows several risk signals and your safety net is thin. There's no need to panic, but the steps below are worth starting now, while you still have time on your side."];
  if(exposed && ready) return ["Exposed, but ready","Your job shows real risk signals, but you've built a solid cushion. Keep it strong and focus on lowering your exposure at work."];
  if(!exposed && !ready) return ["Calm now, unprotected","Your job looks fairly stable today, but your safety net is thin. Things can change quickly, so build your cushion while there's no pressure."];
  return ["Steady ground","Your job looks fairly stable and you're well prepared. Keep the habits that got you here, and check in again every few months."];
}

function countUp(el,to){
  if(reduce.matches){ el.textContent=to; return; }
  let t0=null;
  const f=t=>{ if(t0===null) t0=t; const p=Math.min(1,(t-t0)/1000); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f); };
  setTimeout(()=>requestAnimationFrame(f),300);
}

function reveal(){
  const els = app.querySelectorAll(".rv");
  if(reduce.matches || !("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  const io = new IntersectionObserver(es=>{
    let k=0;
    es.forEach(en=>{ if(en.isIntersecting){ en.target.style.transitionDelay=(k++*90)+"ms"; en.target.classList.add("in"); io.unobserve(en.target); } });
  },{rootMargin:"0px 0px -6% 0px"});
  els.forEach(e=>io.observe(e));
}

function renderResult(){
  clearTimeout(timer); busy=false; ms=null; topbar.hidden=true;
  step = QS.length;
  persist();
  const {exposure,cushion} = compute();
  const [eb,ec]=expBand(exposure), [cb,cc]=cushBand(cushion);
  const [vt,vd]=verdict(exposure,cushion);

  const drivers = QS.filter(q=>q.type==="risk" && points(q)>=2 && q.driver)
    .sort((a,b)=>points(b)*b.w-points(a)*a.w).slice(0,3);

  const tasks = [];
  QS.forEach(q=>{
    const p=points(q);
    if(!q.tip) return;
    if(q.type==="risk" && p>=2) tasks.push({when:q.tip.when,t:q.tip.t,score:p*q.w});
    if(q.type==="cushion" && p<=1.5) tasks.push({when:(q.id==="savings"&&p===0)?"week":q.tip.when,t:q.tip.t,score:(3-p)*1.2});
  });
  if(tasks.length<4){
    tasks.push({when:"month",t:"Keep a running list of your wins with numbers attached. It makes reviews, promotions and job searches far easier.",score:0});
    tasks.push({when:"90",t:"Take this check again in three months to see whether anything has shifted.",score:0});
  }
  const groups = ["week","month","90"].map(w=>({w,items:tasks.filter(t=>t.when===w).sort((a,b)=>b.score-a.score).slice(0,4)})).filter(g=>g.items.length);
  let ticks = load(TKEY);
  if(!ticks || typeof ticks!=="object") ticks = {};

  const shareText = `I just took a free Layoff Readiness Check.\nJob exposure: ${eb}. Safety net: ${cb}.\nIt takes 4 minutes and your answers never leave your browser. Worth checking where you stand.`;

  app.innerHTML = `${brand}
    <div class="rv">
      <p class="meta" style="margin-bottom:6px">Your result</p>
      <h1 class="verdict" id="vh" tabindex="-1">${vt}</h1>
      <p class="lede">${vd}</p>
    </div>
    <div class="rv">${quadSVG(true)}</div>
    <div class="scores rv">
      <div class="score"><div class="lab">Job exposure</div><div class="band">${eb} <span class="num"><span class="sep">· </span><span id="n1">0</span>/100</span></div><div class="bar"><i id="b1" style="background:${ec}"></i></div></div>
      <div class="score"><div class="lab">Safety net</div><div class="band">${cb} <span class="num"><span class="sep">· </span><span id="n2">0</span>/100</span></div><div class="bar"><i id="b2" style="background:${cc}"></i></div></div>
    </div>

    <section class="block rv">
      <h2>What's driving your exposure</h2>
      ${drivers.length? drivers.map(q=>`<div class="driver"><span class="pip" style="background:${points(q)>=2.5?'var(--high)':'var(--mid)'}"></span><div><h3>${q.driver.title}</h3><p>${q.driver.why}</p></div></div>`).join("")
        : `<p>No strong risk signals stood out in your answers. That's good news. The plan below focuses on keeping you prepared.</p>`}
    </section>

    <section class="block rv">
      <h2>Your action plan</h2>
      <p class="meta">Tick things off as you go. Start with this week's list.</p>
      <div class="plan-prog">
        <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="trk" cx="22" cy="22" r="18"/><circle class="val" id="ringv" cx="22" cy="22" r="18" pathLength="100"/></svg>
        <div><b id="pcount"></b><p class="meta">Your ticks are saved on this device.</p></div>
      </div>
      <p class="plan-done" id="pdone" role="status"></p>
      ${groups.map(g=>`<div class="when"><h3>${WHEN[g.w].t} <span>${WHEN[g.w].s}</span></h3><ul class="tasks">
        ${g.items.map((t,i)=>`<li class="${ticks[t.t]?'done':''}"><input type="checkbox" id="t-${g.w}-${i}" ${ticks[t.t]?'checked':''}>${CHECK}<label for="t-${g.w}-${i}">${esc(t.t)}</label></li>`).join("")}
      </ul></div>`).join("")}
      <div class="row" style="margin-top:22px"><button class="btn-quiet" id="print">Save my plan as PDF</button></div>
    </section>

    <section class="block rv noprint">
      <h2>Share it with someone who'd find it useful</h2>
      <div class="share">
        <p class="meta" style="margin:0">Your answers aren't included, only your two scores.</p>
        <textarea id="sharetext" aria-label="Text to share">${esc(shareText)}</textarea>
        <div class="row"><button class="btn" id="copy">Copy text</button><span class="toast" id="toast" role="status"></span></div>
      </div>
      <div class="row" style="margin-top:22px"><button class="btn-quiet" id="redo">Change my answers</button><button class="btn-quiet" id="restart">Start over</button></div>
    </section>

    <p class="note">This is a self-assessment based on common patterns in how companies make layoff decisions. It isn't a prediction, and no tool can know your company's plans. Use it to spot blind spots and get prepared. If worry about your job is weighing on you, talking it through with someone you trust can really help.</p>`;

  const boxes = [...app.querySelectorAll(".tasks input")];
  const planProgress = ()=>{
    const n = boxes.filter(c=>c.checked).length;
    document.getElementById("pcount").textContent = `${n} of ${boxes.length} done`;
    document.getElementById("ringv").style.strokeDashoffset = 100-n/boxes.length*100;
    document.getElementById("pdone").textContent = n===boxes.length ? "Nice work — you've completed your plan. Check back in 3 months." : "";
  };
  boxes.forEach(c=>c.onchange=()=>{
    c.closest("li").classList.toggle("done",c.checked);
    const t = c.parentElement.querySelector("label").textContent;
    if(c.checked) ticks[t]=true; else delete ticks[t];
    store(TKEY,ticks);
    planProgress();
  });
  document.getElementById("print").onclick=()=>window.print();
  document.getElementById("copy").onclick=async()=>{
    const ta=document.getElementById("sharetext"), toast=document.getElementById("toast");
    try{ await navigator.clipboard.writeText(ta.value); toast.textContent="Copied"; }
    catch(e){ ta.focus(); ta.select(); try{document.execCommand("copy");toast.textContent="Copied";}catch(_){toast.textContent="Press Ctrl+C or Cmd+C to copy";} }
    setTimeout(()=>toast.textContent="",2500);
  };
  document.getElementById("redo").onclick=()=>{step=0;renderQ(1);};
  document.getElementById("restart").onclick=()=>{answers={};store(KEY,null);renderIntro();};

  window.scrollTo(0,0);
  document.getElementById("vh").focus({preventScroll:true});
  reveal();
  countUp(document.getElementById("n1"),exposure);
  countUp(document.getElementById("n2"),cushion);
  // place dot: plot area x 30..336, y 10..316
  const x = 30 + 12 + (cushion/100)*(306-24);
  const y = 10 + 12 + (1-exposure/100)*(306-24);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.getElementById("dot").style.transform=`translate(${x}px,${y}px)`;
    document.getElementById("b1").style.width=Math.max(4,exposure)+"%";
    document.getElementById("b2").style.width=Math.max(4,cushion)+"%";
    planProgress();
  }));
}

renderIntro();
</script>
</body>
</html>
